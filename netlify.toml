[build]
  command = "node scripts/build-public.mjs"
  publish = "public-site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/AI%E7%B6%B2%E7%AB%99"
  to = "/#support"
  status = 301

[[redirects]]
  from = "/AI%E7%B6%B2%E7%AB%99/*"
  to = "/#support"
  status = 301

[[redirects]]
  from = "/ai%E7%B6%B2%E7%AB%99"
  to = "/#support"
  status = 301

[[redirects]]
  from = "/ai%E7%B6%B2%E7%AB%99/*"
  to = "/#support"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
